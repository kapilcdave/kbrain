<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kbrain HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0e18;--panel:#161929;--panel2:#1d2135;--line:#2c3154;--ink:#ece8d6;--dim:#8d8fa8;--gold:#f4c542;
  --green:#5fd068;--red:#ef5b5b;--blue:#5aa9ff;--purple:#b48cff;--px:'Press Start 2P',monospace;--mono:'VT323',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:19px}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 18px;border-bottom:3px solid var(--line);background:var(--panel)}
:root[data-theme=lamplight]{--bg:#07080c;--panel:#0d0f15;--panel2:#131620;--line:#1f2230;--gold:#e8c468}
:root[data-theme=minimal]{--bg:#060709;--panel:#0b0c10;--panel2:#111319;--line:#1a1c24}
:root[data-theme=minimal] body>header,:root[data-theme=minimal] .alert{display:none!important}
:root[data-theme=minimal] main{display:block;padding:0}
:root[data-theme=minimal] aside,:root[data-theme=minimal] .cmd{display:none}
:root[data-theme=minimal] .world{border:0;background:var(--bg)}
:root[data-theme=minimal] canvas{height:100vh;object-fit:contain}
:root[data-theme=minimal] body.cmdshow .cmd{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;border-top:1px solid var(--line)}
:root[data-view=office] body>header,:root[data-view=office] .alert,:root[data-view=office] aside,:root[data-view=office] .cmd{display:none!important}
:root[data-view=office] body{background:#15121b}
:root[data-view=office] main{display:block;padding:0}
:root[data-view=office] .world{border:0;background:#15121b}
:root[data-view=office] canvas{height:100vh;object-fit:contain}
:root[data-theme=pipeline]{--bg:#07080c;--panel:#0c0d12;--panel2:#13151c;--line:#1f2230;--gold:#f4c542}
:root[data-theme=blueprint]{--bg:#071c33;--panel:#0a2540;--panel2:#0e2f52;--line:#24578a;--ink:#e6f1ff;--dim:#8fb3d9;--gold:#ffd166}
.themes{display:flex;gap:2px;padding:2px 4px}.themes button{background:none;border:0;color:var(--dim);cursor:pointer;font-family:var(--px);font-size:8px;padding:4px 6px}
.themes button.on{color:var(--gold)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;align-items:center}
.chip{border:2px solid var(--line);background:var(--panel);padding:4px 10px;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;margin-right:6px;background:var(--red);box-shadow:0 0 8px var(--red)}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
.btn{font-family:var(--px);font-size:10px;padding:9px 12px;border:3px solid #000;cursor:pointer;background:var(--panel2);box-shadow:3px 3px 0 #000}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.stop{background:#a8282c}.btn.go{background:#2b7a3d}.btn.ack{background:#a87a12}
.alert{display:none;background:#5a1a1d;border-bottom:3px solid var(--red);padding:8px 18px;font-family:var(--px);font-size:10px;line-height:1.8}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;padding:14px}
@media (max-width:1100px){main{grid-template-columns:1fr}}
.world{border:3px solid var(--line);background:#000;position:relative}
.pop{position:absolute;display:none;z-index:4;width:340px;background:#0d0e12;color:#f2f2f2;border:3px solid #e6e6e6;padding:10px 13px 11px;
  font:21px/1.15 var(--mono);box-shadow:5px 5px 0 #000}
.pop:before,.pop:after{content:"";position:absolute;background:#e6e6e6;width:7px;height:7px}
.pop:before{left:-10px;top:22px}.pop:after{left:-17px;top:29px}
.pop.flip:before{left:auto;right:-10px}.pop.flip:after{left:auto;right:-17px}
.pop .who{font-family:var(--px);font-size:11px;letter-spacing:1px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
.pop .t{color:#8a8d99}.pop .doing{margin:2px 0 6px}.pop .sum{border-top:1px dashed #2a2d38;margin-top:7px;padding-top:6px;color:#c9cbd3}
.pop a{color:#e0b040;cursor:pointer;text-decoration:none}
.pop .ctl{border-top:1px dashed #2a2d38;margin-top:8px;padding-top:8px}
.pop .btns{display:flex;gap:8px;margin:8px 0}
.pop .pb{font:inherit;background:#0d0e12;color:#f2f2f2;border:2px solid #e6e6e6;padding:3px 10px;cursor:pointer;box-shadow:3px 3px 0 #000}
.pop .pb:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}.pop .pb:disabled{opacity:.5}
.pop .pb.go{border-color:#5fd068;color:#5fd068}.pop .pb.warn{border-color:#e0b040;color:#e0b040}
.pop .msg{display:flex;gap:6px}.pop .msg input{flex:1;min-width:0;font:inherit;background:#060709;color:#f2f2f2;border:2px solid #3a3d48;padding:3px 6px}
.pop .msg input:focus{outline:none;border-color:#e6e6e6}.pop .row{display:flex;justify-content:space-between;margin-top:8px}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:pointer}
.cmd{display:flex;gap:8px;padding:10px;background:var(--panel);border-top:3px solid var(--line);flex-wrap:wrap}
.cmd select,.cmd input{background:var(--bg);border:2px solid var(--line);padding:6px 8px}
.cmd input.text{flex:1;min-width:180px}
.cmd input.slug{width:200px;display:none}
aside{display:flex;flex-direction:column;border:3px solid var(--line);background:var(--panel);min-height:0;max-height:calc(100vh - 140px)}
.tabs{display:flex;border-bottom:3px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:10px 4px;font-family:var(--px);font-size:9px;color:var(--dim);cursor:pointer}
.tabs button.on{color:var(--gold);background:var(--panel2)}
.pane{overflow:auto;padding:10px;display:none;flex:1}
.pane.on{display:block}
.col h4{font-family:var(--px);font-size:9px;margin:12px 0 6px;color:var(--dim);display:flex;justify-content:space-between}
.hyp{border-left:4px solid var(--dim);background:var(--panel2);padding:4px 8px;margin:4px 0;line-height:1.05}
.hyp b{font-weight:normal;color:var(--ink)}.hyp div{color:var(--dim);font-size:16px}
.ev{padding:3px 2px;border-bottom:1px dashed #262a45;cursor:default;line-height:1.05}
.ev[data-task]{cursor:pointer}.ev[data-task]:hover{background:var(--panel2)}
.ev time{color:var(--dim);margin-right:6px}.ev .k{display:inline-block;width:20px;text-align:center}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:3px 4px;border-bottom:1px solid #262a45;font-weight:normal}
th{color:var(--dim)}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:3px solid var(--gold);
  transform:translateX(105%);transition:transform .18s;z-index:10;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{border:0;padding:12px 14px}.drawer h3{font-family:var(--px);font-size:12px;margin:0;color:var(--gold);line-height:1.6}
.drawer .body{overflow:auto;padding:0 14px 14px;flex:1}
pre{white-space:pre-wrap;word-break:break-word;background:#07080f;border:2px solid var(--line);padding:8px;font-size:16px;max-height:45vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:3px solid var(--gold);padding:10px 16px;
  font-family:var(--px);font-size:10px;z-index:20;display:none;box-shadow:4px 4px 0 #000}
.muted{color:var(--dim)}
</style>
</head>
<body>
<header>
  <div class="chips">
    <span class="chip themes" id="themes"><button data-theme-btn="classic">CLASSIC</button><button data-theme-btn="lamplight">LAMPLIGHT</button><button data-theme-btn="blueprint">BLUEPRINT</button><button data-theme-btn="pipeline">PIPELINE</button><button data-theme-btn="minimal">MINIMAL</button></span>
    <span class="chip"><span class="dot" id="runnerDot"></span><span id="runnerTxt">runner</span></span>
    <span class="chip" id="runsChip">runs —</span>
    <span class="chip" id="memChip">mem —</span>
    <span class="chip" id="slotsChip">slots —</span>
    <button class="btn ack" id="ackBtn" style="display:none">ACK STALL</button>
    <button class="btn stop" id="stopBtn">STOP</button>
  </div>
</header>
<div class="alert" id="stallBar">⚠ STALLED: no hypothesis has changed state in a while, so the chief of staff is paused. Read the feed, adjust the goal or routing, then ACK.</div>
<main>
  <section class="world">
    <div class="pop" id="pop"></div>
    <canvas id="cv" width="1920" height="1200" aria-label="kbrain office: one room per agent role"></canvas>
    <form class="cmd" id="cmd">
      <select id="cmdRole" aria-label="send to">
        <option value="chief">→ Chief of Staff</option>
        <option value="researcher">→ Researcher (new hypothesis)</option>
        <option value="curator">→ Curator</option>
      </select>
      <input class="slug" id="cmdSlug" placeholder="hypothesis-slug" pattern="[a-z0-9][a-z0-9-]{2,60}">
      <input class="text" id="cmdText" placeholder="Tell the chief of staff what to look into…" maxlength="300" required>
      <button class="btn go" type="submit">SEND</button>
    </form>
  </section>
  <aside>
    <div class="tabs" role="tablist">
      <button class="on" data-tab="board">BOARD</button><button data-tab="feed">FEED</button>
      <button data-tab="queue">QUEUE</button><button data-tab="models">MODELS</button>
    </div>
    <div class="pane on" id="board"></div>
    <div class="pane" id="feed"></div>
    <div class="pane" id="queue"></div>
    <div class="pane" id="models"></div>
  </aside>
</main>
<div class="drawer" id="drawer"><header><h3 id="dTitle">—</h3><button class="btn" id="dClose" style="margin-left:auto">X</button></header><div class="body" id="dBody"></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = (p, body) => fetch(p, body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json","X-KB":"1"}, body:JSON.stringify(body)}).then(r => r.json());

// ---------- world model ----------
const W = 960, H = 600, S = 3;
const ROLE = {
  chief:      {name:"Chief of Staff", room:0, shirt:"#c8902a", acc:"#7a1f1f", hair:"#3a2a1a", skin:"#e0ac69", blurb:"Reads the state digest, proposes new hypotheses, never does the work itself."},
  researcher: {name:"Researcher",     room:1, shirt:"#3c7fc4", acc:"#9fd3ff", hair:"#1b1b1b", skin:"#c68642", blurb:"Turns ideas into falsifiable preregistrations, which the harness freezes."},
  backtester: {name:"Backtester",     room:2, shirt:"#e8ecef", acc:"#3a9a5a", hair:"#7a4a20", skin:"#f1c27d", blurb:"Implements the frozen prereg. Code grades its metrics, not its opinion."},
  skeptic:    {name:"Skeptic",        room:3, shirt:"#8a2b2b", acc:"#f0d0d0", hair:"#a8a8a8", skin:"#ffdbac", blurb:"Assumes every passing backtest is wrong and tries to prove it."},
  curator:    {name:"Curator",        room:4, shirt:"#7d55b8", acc:"#e5d4ff", hair:"#c46a2a", skin:"#8d5524", blurb:"Compacts memory: indexes results and dead ends."},
  engineer:   {name:"Data Engineer",  room:5, shirt:"#1f9e89", acc:"#c8f5ec", hair:"#5a3a1a", skin:"#d9a066", blurb:"Writes data collectors; the harness runs them in the background so nobody waits on data."},
  kalshi:     {name:"Kalshi Desk",    room:2, shirt:"#2fa36b", acc:"#0e3d26", hair:"#2a1a0e", skin:"#e8b98a", blurb:"Standing desk: Kalshi recurring 15M/hourly crypto. Works nonstop, commits to git."},
  hyperliquid:{name:"Hyperliquid Desk",room:1, shirt:"#36c2c2", acc:"#0d3b3b", hair:"#d8c27a", skin:"#f1c27d", blurb:"Standing desk: Hyperliquid perps, the Tokyo tapes and maker cells."},
  predx:      {name:"PredX Desk",     room:1, shirt:"#d9534f", acc:"#ffe0de", hair:"#121212", skin:"#a86b3c", blurb:"Standing desk: Gemini and Polymarket US 5M/15M crypto, cross-venue with Kalshi."},
  data:       {name:"Data Desk",      room:5, shirt:"#e08a2a", acc:"#3b2508", hair:"#6b3a1a", skin:"#d9a066", blurb:"Standing desk: WebSocket-first collectors and tape health; serves the other desks."},
  review:     {name:"Review Desk",    room:3, shirt:"#5b6bd8", acc:"#dfe3ff", hair:"#4a4a4a", skin:"#ffdbac", blurb:"Standing desk: audits the other desks' newest claims against the estimator traps."},
};
// open-plan office: seat positions (feet) per role, and places idle bros wander to
const OFFICE = {chief:{x:118,y:236}, kalshi:{x:300,y:236}, hyperliquid:{x:440,y:236}, predx:{x:580,y:236},
  data:{x:300,y:380}, review:{x:440,y:380}, researcher:{x:580,y:380},
  backtester:{x:300,y:524}, skeptic:{x:440,y:524}, engineer:{x:580,y:524}, curator:{x:118,y:524}};
const POI = [{x:812,y:150,n:"board"}, {x:880,y:250,n:"coffee"}, {x:760,y:360,n:"couch"}, {x:840,y:372,n:"couch"},
  {x:900,y:470,n:"rack"}, {x:760,y:540,n:"mail"}, {x:60,y:380,n:"books"}, {x:200,y:440,n:"window"}];
const ROOMS = [
  {name:"CHIEF'S OFFICE", f1:"#3b2f2a", f2:"#43352f", wall:"#5a3f2c"},
  {name:"LIBRARY",        f1:"#23324a", f2:"#283a55", wall:"#2f4466"},
  {name:"BACKTEST LAB",   f1:"#22382c", f2:"#274033", wall:"#2e5240"},
  {name:"SKEPTIC'S COURT",f1:"#3e2326", f2:"#47282c", wall:"#5e2f33"},
  {name:"ARCHIVE",        f1:"#30263f", f2:"#372c48", wall:"#46375c"},
  {name:"MAILROOM · QUEUE", f1:"#2c2c30", f2:"#333338", wall:"#46464e"},
].map((r, i) => ({...r, x:(i % 3) * 320, y:Math.floor(i / 3) * 300}));
const MAIL = ROOMS[5];
const PIPE = {beltY:285, st:{chief:130, researcher:310, backtester:490, skeptic:670}, exitX:860,
              binX:770, binY:430, shelf:{x0:150, x1:440, y:455}, curator:{x:575, y:485}, inbox:{x:70, y:70}};
const STAGE_X = {idea:130, prereg:310, backtest:490, review:670};
const GATE = {chief:"#e0b040", researcher:"#5aa9ff", backtester:"#5fd068", skeptic:"#f4c542"};
const HCOL = {data:"#1f9e89", idea:"#8d8fa8", prereg:"#5aa9ff", backtest:"#5fd068", review:"#f4c542", validated:"#f4c542", rejected:"#ef5b5b", parked:"#555a78"};
const MIN = {chief:{x:110, y:120}, researcher:{x:540, y:120}, backtester:{x:180, y:260}, skeptic:{x:600, y:260}, curator:{x:110, y:400}, engineer:{x:560, y:400},
  kalshi:{x:330, y:190}, hyperliquid:{x:780, y:190}, predx:{x:330, y:330}, data:{x:780, y:330}, review:{x:330, y:540}};
const MINCOL = {chief:"#e0b040", researcher:"#5aa9ff", backtester:"#5fd068", skeptic:"#ef6b6b", curator:"#b48cff", engineer:"#1f9e89",
  kalshi:"#2fa36b", hyperliquid:"#36c2c2", predx:"#d9534f", data:"#e08a2a", review:"#5b6bd8"};
function homeOf(role) {
  if (THEME === "minimal") return MIN[role];
  if (role === "curator") return PIPE.curator;
  if (role === "engineer" || role === "data") return {x:role === "data" ? 260 : 200, y:530};
  if (PIPE.st[role]) return {x:PIPE.st[role], y:PIPE.beltY - 30};
  return {x:{kalshi:820, hyperliquid:880, predx:820, review:880}[role] || 820, y:{kalshi:120, hyperliquid:120, predx:200, review:200}[role] || 160};
}
const layoutOf = t => (t === "pipeline" || t === "minimal" || t === "office") ? t : "rooms";
const roomCenter = i => {
  if (THEME === "office") { const o = OFFICE[roleOf(i)] || OFFICE.chief; return {x:o.x, y:o.y + 40}; }
  if (THEME !== "pipeline") return {x:ROOMS[i].x + 160, y:ROOMS[i].y + 200};
  if (i === 5) return {x:PIPE.inbox.x, y:PIPE.inbox.y + 20};
  const h = homeOf(Object.keys(ROLE)[i]); return {x:h.x, y:h.y - 20};
};
const mailPos = () => THEME === "office" ? {x:760, y:520} : THEME === "pipeline" ? {x:PIPE.inbox.x, y:PIPE.inbox.y + 20} : {x:MAIL.x + 230, y:MAIL.y + 200};

const BODY = ["...hhhhhh...","..hhhhhhhh..","..hkkkkkkh..","..kekkkkek..","..kkkkkkkk..","...kkmmkk...","....kkkk....",
              "..ssssssss..",".sssssassss.","ksssssassssk","k.ssssssss.k","..pppppppp.."];
const LEGS = [["..ppp..ppp..","..ppp..ppp..","..bbb..bbb.."], [".ppp....ppp.",".pp......pp.",".bb......bb."]];

class Agent {
  constructor(role) {
    this.role = role; this.m = ROLE[role]; this.r = ROOMS[this.m.room];
    this.x = this.r.x + 60 + Math.random() * 200; this.y = this.r.y + 230;
    this.tx = this.x; this.ty = this.y; this.wait = 0; this.walkT = 0; this.moving = false;
    this.task = null; this.mood = null; this.moodT = 0;
  }
  desk() { return THEME === "office" ? OFFICE[this.role] : layoutOf(THEME) !== "rooms" ? homeOf(this.role) : {x:this.r.x + 160, y:this.r.y + 126}; }
  update(dt) {
    if (this.task) { const d = this.desk(); this.tx = d.x; this.ty = d.y; }
    else if (Math.hypot(this.tx - this.x, this.ty - this.y) < 1 && (this.wait -= dt) <= 0) {
      if (THEME === "office") {                     // wander: coffee, the board, the couch, a colleague's desk
        const r = Math.random(), others = Object.keys(OFFICE).filter(k => k !== this.role);
        const t = r < .55 ? POI[Math.floor(Math.random() * POI.length)]
                : r < .85 ? (o => ({x:o.x + 34, y:o.y + 18}))(OFFICE[others[Math.floor(Math.random() * others.length)]])
                : {x:OFFICE[this.role].x + 30, y:OFFICE[this.role].y + 22};
        this.tx = t.x + (Math.random() - .5) * 24; this.ty = t.y + (Math.random() - .5) * 10;
      }
      else if (layoutOf(THEME) !== "rooms") { const h = homeOf(this.role), r = THEME === "minimal" ? 12 : 44; this.tx = h.x + (Math.random() - .5) * r; this.ty = h.y - Math.random() * (THEME === "minimal" ? 3 : 6); }
      else { this.tx = this.r.x + 40 + Math.random() * 240; this.ty = this.r.y + 195 + Math.random() * 80; }
      this.wait = 1500 + Math.random() * 3500;
    }
    const dx = this.tx - this.x, dy = this.ty - this.y, dist = Math.hypot(dx, dy);
    const sp = (this.task ? 0.14 : 0.05) * dt * (this.mood === "sleep" ? 0 : 1);
    this.moving = dist > 1 && sp > 0;
    if (this.moving) { this.x += dx / dist * Math.min(sp, dist); this.y += dy / dist * Math.min(sp, dist); this.walkT += dt; }
    if (this.moodT > 0 && (this.moodT -= dt) <= 0) this.mood = null;
  }
  setMood(m, ms) { this.mood = m; this.moodT = ms; }
  hit(px, py) {
    const big = THEME === "minimal", b = this.bub;
    if (Math.abs(px - this.x) < (big ? 34 : 26) && py > this.y - (big ? 86 : 66) && py < this.y + (big ? 26 : 8)) return true;
    return big && !!b && px >= b.x - 12 && px <= b.x + b.w + 12 && py >= b.y && py <= b.y + b.h;
  }
}
const agents = Object.keys(ROLE).map(r => new Agent(r));
const byRole = Object.fromEntries(agents.map(a => [a.role, a]));
let particles = [], floats = [], letters = [], STATE = null, lastEvent = 0, clock = 0;

// ---------- drawing ----------
const cv = $("#cv"), ctx = cv.getContext("2d");
ctx.setTransform(2, 0, 0, 2, 0, 0);            // 2x backing store: crisp when scaled
ctx.imageSmoothingEnabled = false;

// ---------- themes ----------
const BP = {bg:"#0a2540", grid:"#0f3156", line:"#a9d1f7", faint:"#3a73aa", hi:"#ffd166"};
const DIMC = {office:"#a7a9bd", classic:"#8d8fa8", lamplight:"#4a4f60", blueprint:"#5d8fc4", pipeline:"#4a4f60", minimal:"#3e4250"};
// Default view is the OFFICE: one open-plan pixel workspace, nothing else on screen.
// Other layouts (with panels and controls): ?theme=classic|lamplight|blueprint|pipeline|minimal
const QTHEME = new URLSearchParams(location.search).get("theme");
let THEME = QTHEME || "office";
if (!["office", "classic", "lamplight", "blueprint", "pipeline", "minimal"].includes(THEME)) THEME = "office";
if (THEME === "office") document.documentElement.dataset.view = "office";
function placeAgents() {                           // start everyone at their post for the current layout
  for (const a of agents) {
    if (THEME === "office") { const o = OFFICE[a.role]; a.x = o.x + (Math.random() - .5) * 60; a.y = o.y + 20 + Math.random() * 30; }
    else if (layoutOf(THEME) !== "rooms") { const h = homeOf(a.role); a.x = h.x + (THEME === "minimal" ? 0 : (Math.random() - .5) * 30); a.y = h.y; }
    else { a.x = a.r.x + 60 + Math.random() * 200; a.y = a.r.y + 230; }
    a.tx = a.x; a.ty = a.y;
  }
}
function setTheme(t) {

  for (const [st, list] of Object.entries(groups)) list.forEach((h, k) => {

    else if (st === "validated") { tx = PIPE.exitX - 12 + (k % 2) * 24; ty = PIPE.beltY - 14 - Math.floor(k / 2) * 15; }
    else if (st === "rejected") { tx = PIPE.binX - 33 + (k % 4) * 22; ty = PIPE.binY + 30 - Math.floor(k / 4) * 15; }
    else { tx = PIPE.shelf.x0 + 14 + (k % 12) * 24; ty = PIPE.shelf.y - 14 - Math.floor(k / 12) * 15; }

}
function feedLine(e) {
  const el = document.createElement("div"); el.className = "ev"; if (e.task_id) el.dataset.task = e.task_id;
  const t = new Date(e.ts * 1000).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});
  el.innerHTML = `<time>${t}</time><span class="k" style="color:${KCOL[e.kind] || "#8d8fa8"}">${ICON[e.kind] || "·"}</span>${esc(describe(e))}`;
  return el;
}

async function pollEvents() {
  try {
    const evs = await api(`/api/events?after=${lastEvent}&limit=${lastEvent ? 300 : 150}`);
    const feed = $("#feed"), first = lastEvent === 0;
    for (const e of evs) { if (!first) animate(e); feed.prepend(feedLine(e)); lastEvent = Math.max(lastEvent, e.id); }
    while (feed.children.length > 400) feed.lastChild.remove();
  } catch (_) {}
}

// ---------- state -> panels ----------
const HSTAGES = [["idea","#8d8fa8"],["prereg","#9fd3ff"],["backtest","#5aa9ff"],["data","#1f9e89"],["review","#f4c542"],["validated","#5fd068"],["rejected","#ef5b5b"],["parked","#555a78"]];
async function pollState() {
  try { STATE = await api("/api/state"); } catch (_) { $("#runnerTxt").textContent = "HQ server unreachable"; return; }
  const s = STATE, online = s.runner_age_s !== null && s.runner_age_s < 45;
  $("#runnerDot").classList.toggle("on", online);
  $("#runnerTxt").textContent = online ? (s.runner_state || "runner online") : "runner offline";
  $("#runsChip").textContent = `runs/24h ${s.runs_today}/${s.max_runs}`;
  $("#memChip").textContent = `mem ${s.mem_mb}MB`;
  $("#slotsChip").textContent = `open slots ${s.open_slots}`;
  $("#stopBtn").textContent = s.stop ? "RESUME" : "STOP"; $("#stopBtn").className = "btn " + (s.stop ? "go" : "stop");
  $("#ackBtn").style.display = s.stalled ? "" : "none"; $("#stallBar").style.display = s.stalled ? "block" : "none";
  for (const a of agents) a.task = s.running.find(t => t.role === a.role) || null;
  crateTargets();
  if (POP.agent && !document.querySelector("#pop:hover") && !$("#pop").contains(document.activeElement)) renderPop();

  $("#board").innerHTML = HSTAGES.map(([st, col]) => {
    const hs = s.hypotheses.filter(h => h.status === st);
    return `<div class="col"><h4><span style="color:${col}">${st.toUpperCase()}</span><span>${hs.length}</span></h4>` +
      (hs.map(h => `<div class="hyp" style="border-color:${col}"><b>${esc(h.slug)}</b>${h.reason ? `<div>${esc(h.reason)}</div>` : ""}</div>`).join("") || `<div class="muted">—</div>`) + `</div>`;
  }).join("") + (s.hypotheses.length ? "" : `<p class="muted">No hypotheses yet. Send the chief of staff an idea, or start the runner and let the heartbeat wake it.</p>`);

  const row = t => `<tr data-task="${t.id}" style="cursor:pointer"><td>#${t.id}</td><td>${esc(t.role)}</td><td>${esc(t.title)}${t.hypothesis ? ` <span class="muted">[${esc(t.hypothesis)}]</span>` : ""}</td></tr>`;
  $("#queue").innerHTML = `<h4 class="col"><span>RUNNING</span></h4><table>${s.running.map(row).join("") || "<tr><td class=muted>idle</td></tr>"}</table>` +
    `<h4 class="col"><span>QUEUED</span></h4><table>${s.queued.map(row).join("") || "<tr><td class=muted>empty</td></tr>"}</table>`;
  $("#models").innerHTML = `<table><tr><th>model</th><th>runs</th><th>ok</th><th>avg s</th></tr>` +
    s.stats.map(m => `<tr><td>${esc(m.model)}</td><td>${m.n}</td><td>${Math.round(100 * m.ok / m.n)}%</td><td>${Math.round(m.avg_s || 0)}</td></tr>`).join("") +
    `</table><h4 class="col"><span>ROUTING</span></h4>` +
    Object.entries(s.roles).map(([r, v]) => `<div class="hyp"><b>${esc(r)}</b><div>${v.models.map(esc).join(" → ")}</div></div>`).join("");
}

// ---------- inspector ----------
function openDrawer(title, html) { $("#dTitle").textContent = title; $("#dBody").innerHTML = html; $("#drawer").classList.add("on"); }
async function openTask(id) {
  const d = await api(`/api/task/${id}`); if (d.error) return;
  const t = d.task, res = t.result ? JSON.parse(t.result) : null;
  openDrawer(`#${t.id} ${t.role.toUpperCase()}`, `<p>${esc(t.title)}</p>
    <p class="muted">status <b>${esc(t.status)}</b> · attempts ${t.attempts}/${t.max_attempts} · hypothesis ${esc(t.hypothesis || "—")}</p>
    ${res ? `<h4 class="col"><span>RESULT</span></h4><pre>${esc(JSON.stringify(res, null, 2))}</pre>` : ""}
    <h4 class="col"><span>RUNS</span></h4><table>${d.runs.map(r => `<tr><td>${esc(r.model)}</td><td>${esc(r.outcome || "running")}</td><td>${r.ended ? Math.round(r.ended - r.started) + "s" : ""}</td></tr>`).join("")}</table>
    <h4 class="col"><span>SPEC</span></h4><pre>${esc(t.spec)}</pre>
    <h4 class="col"><span>LOG TAIL</span></h4><pre>${esc(d.log || "(no log)")}</pre>`);
}
function openAgent(a) {
  const cur = a.task || (STATE && STATE.last_by_role[a.role]);
  const chain = STATE && STATE.roles[a.role] ? STATE.roles[a.role].models.map(esc).join(" → ") : "";
  openDrawer(a.m.name.toUpperCase(), `<p>${esc(a.m.blurb)}</p><p class="muted">model chain: ${chain}</p>
    ${cur ? `<p>${a.task ? "Working on" : "Last task"}: <a href="#" data-open="${cur.id}" style="color:var(--gold)">#${cur.id} ${esc(cur.title)}</a></p>` : "<p class=muted>No tasks yet.</p>"}`);
}
cv.addEventListener("click", ev => {
  const b = cv.getBoundingClientRect(), k = Math.min(b.width / W, b.height / H);
  const x = (ev.clientX - b.left - (b.width - W * k) / 2) / k, y = (ev.clientY - b.top - (b.height - H * k) / 2) / k;
  const a = agents.find(a => a.hit(x, y));
  if (a) return THEME !== "minimal" ? openAgent(a) : POP.agent === a ? closePop() : openPop(a);   // click again to collapse
  closePop();
  if (THEME === "pipeline") for (const c of crates.values()) if (Math.abs(x - c.x) < 13 && y > c.y - 2 && y < c.y + 16)
    return openDrawer(c.slug, `<p>stage: <b style="color:${HCOL[c.status]}">${esc(c.status)}</b></p>${c.reason ? `<p class="muted">${esc(c.reason)}</p>` : ""}`);
});
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-task],[data-open]"); if (!el) return;
  ev.preventDefault(); openTask(el.dataset.task || el.dataset.open);
});
$("#dClose").onclick = () => $("#drawer").classList.remove("on");
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closePop(); $("#drawer").classList.remove("on"); document.body.classList.remove("cmdshow"); }
  if (e.key === "/" && THEME === "minimal" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); document.body.classList.add("cmdshow"); $("#cmdText").focus(); }
});
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button,.pane").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); $("#" + b.dataset.tab).classList.add("on");
});

// ---------- commands ----------
function toast(s) { const t = $("#toast"); t.textContent = s; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 5000); }
$("#cmdRole").onchange = e => {
  const r = e.target.value; $("#cmdSlug").style.display = r === "researcher" ? "" : "none"; $("#cmdSlug").required = r === "researcher";
  $("#cmdText").placeholder = {chief:"Tell the chief of staff what to look into…", researcher:"Describe the idea and its mechanism…", curator:"What should be tidied up?"}[r];
};
$("#cmd").onsubmit = async e => {
  e.preventDefault();
  const role = $("#cmdRole").value, txt = $("#cmdText").value.trim(); if (!txt) return;
  const body = role === "chief" ? {role, title:`Instruction from Kapil: ${txt}`, spec:{instruction:txt}}
    : role === "researcher" ? {role, title:txt, hypothesis:$("#cmdSlug").value.trim(), spec:{idea:txt}}
    : {role, title:txt, spec:{instruction:txt}};
  const r = await api("/api/task", body);
  if (r.error) return toast("✗ " + r.error);
  $("#cmdText").value = "";
  const online = STATE && STATE.runner_age_s !== null && STATE.runner_age_s < 45;
  toast(online ? `✉ queued task #${r.id} for ${role}` : `✉ queued #${r.id}. The runner is offline: start it with kb serve`);
  pollEvents(); pollState();
};
$("#stopBtn").onclick = async () => { await api(STATE && STATE.stop ? "/api/resume" : "/api/stop", {}); pollState(); };
$("#ackBtn").onclick = async () => { await api("/api/ack", {}); pollState(); };

placeAgents(); setTheme(THEME);
pollState().then(() => { const r = new URLSearchParams(location.search).get("pop"); if (r && byRole[r] && THEME === "minimal") openPop(byRole[r]); });
pollEvents();
setInterval(pollState, 2000); setInterval(pollEvents, 2000);
requestAnimationFrame(frame);
</script>
</body>
</html>
