<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kbrain HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0f13;--panel:#121419;--line:#23262f;--ink:#e4e4e7;--dim:#7c8090;--faint:#4a4e5c;
  --gold:#e8c468;--blue:#6aa8ff;--green:#6fd08c;--red:#ef6b6b;--purple:#b597ff;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--mono)}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
.logo{font-weight:600;font-size:15px;letter-spacing:.5px}.logo span{color:var(--dim);font-weight:400}
.chips{display:flex;gap:16px;flex-wrap:wrap;margin-left:auto;align-items:center;color:var(--dim)}
.chips b{color:var(--ink);font-weight:400}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:var(--red);vertical-align:1px}
.dot.on{background:var(--green)}
.btn{padding:5px 12px;border:1px solid var(--line);background:transparent;cursor:pointer;border-radius:3px}
.btn:hover{border-color:var(--dim)}
.btn.stop{color:var(--red);border-color:#5a2a2e}.btn.go{color:var(--green);border-color:#24502f}.btn.ack{color:var(--gold);border-color:#5a4a20}
.alert{display:none;padding:9px 20px;border-bottom:1px solid #5a2a2e;color:var(--red)}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:0;min-height:calc(100vh - 54px)}
@media (max-width:1100px){main{grid-template-columns:1fr}}
.world{border-right:1px solid var(--line);display:flex;flex-direction:column}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;cursor:pointer}
.cmd{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap;margin-top:auto}
.cmd select,.cmd input{background:transparent;border:1px solid var(--line);padding:6px 10px;border-radius:3px}
.cmd select option{background:var(--panel)}
.cmd input.text{flex:1;min-width:180px}.cmd input.slug{width:190px;display:none}
.cmd input:focus,.cmd select:focus{outline:none;border-color:var(--dim)}
aside{display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 54px)}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 12px}
.tabs button{background:none;border:0;border-bottom:1px solid transparent;margin-bottom:-1px;padding:12px 10px;color:var(--dim);cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.pane{overflow:auto;padding:12px 20px;display:none;flex:1}.pane.on{display:block}
h4{font-weight:400;color:var(--dim);margin:16px 0 6px;display:flex;justify-content:space-between;text-transform:lowercase}
h4:first-child{margin-top:4px}
.hyp{padding:5px 0 5px 10px;border-left:2px solid var(--faint);margin:3px 0}
.hyp div{color:var(--dim);font-size:12px}
.ev{padding:4px 0;border-bottom:1px solid #1a1c23;color:var(--ink)}
.ev[data-task]{cursor:pointer}.ev[data-task]:hover{color:#fff}
.ev time{color:var(--faint);margin-right:8px}.ev .k{display:inline-block;width:16px}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:4px 4px 4px 0;border-bottom:1px solid #1a1c23;font-weight:400;vertical-align:top}
th{color:var(--dim)}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--panel);border-left:1px solid var(--line);
  transform:translateX(105%);transition:transform .15s;z-index:10;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer header{padding:14px 20px}.drawer h3{font-size:13px;font-weight:600;margin:0}
.drawer .body{overflow:auto;padding:0 20px 20px;flex:1}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);padding:10px;font-size:12px;max-height:45vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:9px 16px;z-index:20;display:none;border-radius:3px}
.muted{color:var(--dim)}a{color:var(--gold)}
</style>
</head>
<body>
<header>
  <div class="logo">kbrain <span>hq</span></div>
  <div class="chips">
    <span><span class="dot" id="runnerDot"></span><b id="runnerTxt">runner</b></span>
    <span>runs <b id="runsChip">—</b></span>
    <span>mem <b id="memChip">—</b></span>
    <span>open slots <b id="slotsChip">—</b></span>
    <button class="btn ack" id="ackBtn" style="display:none">ack stall</button>
    <button class="btn stop" id="stopBtn">stop</button>
  </div>
</header>
<div class="alert" id="stallBar">Stalled: no hypothesis has changed state for a while, so the chief of staff is paused. Check the feed, adjust the goal or routing, then ack.</div>
<main>
  <section class="world">
    <canvas id="cv" width="1920" height="880" aria-label="kbrain floor: the agents at their desks"></canvas>
    <form class="cmd" id="cmd">
      <select id="cmdRole" aria-label="send to">
        <option value="chief">to chief of staff</option>
        <option value="researcher">to researcher (new hypothesis)</option>
        <option value="curator">to curator</option>
      </select>
      <input class="slug" id="cmdSlug" placeholder="hypothesis-slug" pattern="[a-z0-9][a-z0-9-]{2,60}">
      <input class="text" id="cmdText" placeholder="Tell the chief of staff what to look into…" maxlength="300" required>
      <button class="btn" type="submit">send</button>
    </form>
  </section>
  <aside>
    <div class="tabs" role="tablist">
      <button class="on" data-tab="board">board</button><button data-tab="feed">feed</button>
      <button data-tab="queue">queue</button><button data-tab="models">models</button>
    </div>
    <div class="pane on" id="board"></div>
    <div class="pane" id="feed"></div>
    <div class="pane" id="queue"></div>
    <div class="pane" id="models"></div>
  </aside>
</main>
<div class="drawer" id="drawer"><header><h3 id="dTitle">—</h3><button class="btn" id="dClose" style="margin-left:auto">close</button></header><div class="body" id="dBody"></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = (p, body) => fetch(p, body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json","X-KB":"1"}, body:JSON.stringify(body)}).then(r => r.json());

// ---------- world: one open floor, a row of desks, an inbox ----------
const W = 960, H = 440, S = 3, FONT = '"JetBrains Mono", ui-monospace, monospace';
const C = {bg:"#0e0f13", line:"#23262f", ink:"#e4e4e7", dim:"#7c8090", faint:"#3a3d48", desk:"#2a2d37"};
const ROLE = {
  chief:      {name:"chief of staff", x:300, col:"#e8c468", hair:"#2b2118", skin:"#e0ac69", blurb:"Reads the state digest, proposes new hypotheses, never does the work itself."},
  researcher: {name:"researcher",     x:450, col:"#6aa8ff", hair:"#161616", skin:"#c68642", blurb:"Turns ideas into falsifiable preregistrations, which the harness freezes."},
  backtester: {name:"backtester",     x:600, col:"#6fd08c", hair:"#6b4220", skin:"#f1c27d", blurb:"Implements the frozen prereg. Code grades its metrics, not its opinion."},
  skeptic:    {name:"skeptic",        x:750, col:"#ef6b6b", hair:"#9a9a9a", skin:"#ffdbac", blurb:"Assumes every passing backtest is wrong and tries to prove it."},
  curator:    {name:"curator",        x:900, col:"#b597ff", hair:"#b5612a", skin:"#8d5524", blurb:"Compacts memory: indexes results and dead ends."},
};
const DESK_Y = 250, INBOX = {x:90, y:240};
const BODY = ["...hhhhhh...","..hhhhhhhh..","..hkkkkkkh..","..kekkkkek..","..kkkkkkkk..","....kkkk....",
              "..ssssssss..",".ssssssssss.","kssssssssssk","k.ssssssss.k","..pppppppp.."];
const LEGS = [["..ppp..ppp..","..ppp..ppp..","..bbb..bbb.."], [".ppp....ppp.",".pp......pp.",".bb......bb."]];

class Agent {
  constructor(role) {
    this.role = role; this.m = ROLE[role]; this.hx = this.m.x;
    this.x = this.hx + (Math.random() - .5) * 60; this.y = 340 + Math.random() * 30;
    this.tx = this.x; this.ty = this.y; this.wait = Math.random() * 3000; this.walkT = 0; this.moving = false;
    this.task = null; this.mood = null; this.moodT = 0;
  }
  desk() { return {x:this.hx, y:DESK_Y + 14}; }
  update(dt) {
    if (this.task) { const d = this.desk(); this.tx = d.x; this.ty = d.y; }
    else if (Math.hypot(this.tx - this.x, this.ty - this.y) < 1 && (this.wait -= dt) <= 0) {
      this.tx = this.hx + (Math.random() - .5) * 80; this.ty = 330 + Math.random() * 45; this.wait = 2500 + Math.random() * 5000;
    }
    const dx = this.tx - this.x, dy = this.ty - this.y, dist = Math.hypot(dx, dy);
    const sp = (this.task ? 0.12 : 0.035) * dt * (this.mood === "sleep" ? 0 : 1);
    this.moving = dist > 1 && sp > 0;
    if (this.moving) { this.x += dx / dist * Math.min(sp, dist); this.y += dy / dist * Math.min(sp, dist); this.walkT += dt; }
    if (this.moodT > 0 && (this.moodT -= dt) <= 0) this.mood = null;
  }
  setMood(m, ms) { this.mood = m; this.moodT = ms; }
  hit(px, py) { return Math.abs(px - this.x) < 24 && py > this.y - 52 && py < this.y + 6 || Math.abs(px - this.hx) < 50 && Math.abs(py - DESK_Y) < 40; }
}
const agents = Object.keys(ROLE).map(r => new Agent(r));
const byRole = Object.fromEntries(agents.map(a => [a.role, a]));
let particles = [], floats = [], letters = [], STATE = null, lastEvent = 0, clock = 0;

const cv = $("#cv"), ctx = cv.getContext("2d");
ctx.setTransform(2, 0, 0, 2, 0, 0);          // 2x backing store: crisp text when scaled
const px = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); };
function text(s, x, y, size = 11, color = C.ink, align = "left") {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = "top"; ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function line(x0, y0, x1, y1, c) { ctx.strokeStyle = c; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0 + .5, y0 + .5); ctx.lineTo(x1 + .5, y1 + .5); ctx.stroke(); }

function drawFloor() {
  px(0, 0, W, H, C.bg);
  line(40, 300, W - 20, 300, "#16181e");
}
function drawDesk(a) {
  const x = a.hx - 40, y = DESK_Y, on = !!a.task;
  px(x, y, 80, 3, on ? a.m.col : C.desk);                      // desktop
  px(x + 6, y + 3, 2, 26, C.desk); px(x + 72, y + 3, 2, 26, C.desk);
  ctx.strokeStyle = on ? a.m.col : C.faint; ctx.lineWidth = 1;   // monitor outline
  ctx.strokeRect(a.hx - 16.5, y - 26.5, 32, 21); px(a.hx - 1, y - 5, 2, 5, C.faint);
  if (on) for (let k = 0; k < 3; k++) px(a.hx - 12, y - 22 + k * 5, ((clock / 50 + k * 9) % 22) | 0, 2, a.m.col);
  const st = a.task ? "working" : a.mood === "sleep" ? "napping (rate limit)" : "idle";
  text(a.m.name, a.hx, 396, 11, on ? C.ink : C.dim, "center");
  text(st, a.hx, 412, 10, on ? a.m.col : C.faint, "center");
}
function drawInbox() {
  const q = STATE ? (STATE.counts.queued || 0) : 0, {x, y} = INBOX;
  ctx.strokeStyle = C.faint; ctx.lineWidth = 1; ctx.strokeRect(x - 40.5, y - 6.5, 80, 30);
  for (let k = 0; k < Math.min(q, 12); k++) px(x - 32, y + 14 - k * 4, 64, 2, k % 2 ? C.ink : C.dim);
  text("inbox", x, 396, 11, q ? C.ink : C.dim, "center");
  text(`${q} queued`, x, 412, 10, q ? "#e8c468" : C.faint, "center");
  // runner state, so a stuck queue explains itself
  const s = STATE, online = s && s.runner_age_s !== null && s.runner_age_s < 45;
  if (s && !online) text("runner offline: start it with `kb serve` (or systemctl --user start kb-runner)", 24, 20, 11, "#ef6b6b");
}
function envelope(x, y, c) { px(x - 6, y - 4, 12, 8, C.ink); px(x - 6, y - 4, 12, 1, c); }

function drawAgent(a) {
  const sitting = a.task && !a.moving, bob = sitting ? (Math.floor(clock / 260) % 2) : 0;
  const ox = a.x - 18, oy = a.y - 42 + bob;
  px(a.x - 10, a.y + 1, 20, 2, "#00000066");
  const pal = {h:a.m.hair, k:a.m.skin, e:"#111", s:a.m.col, p:"#2d3140", b:"#121212"};
  const rows = BODY.concat(LEGS[a.moving ? Math.floor(a.walkT / 170) % 2 : 0]);
  rows.forEach((row, ry) => { for (let rx = 0; rx < 12; rx++) { const ch = row[rx]; if (ch !== ".") px(ox + rx * S, oy + ry * S, S, S, pal[ch]); } });
  if (a.mood === "sleep") text("z", a.x + 14, a.y - 56 - (clock / 40 % 12), 11, "#b597ff");
}
function bubble(a) {
  if (!a.task) return;
  let l1 = `#${a.task.id} ${a.task.title}`, l2 = (a.task.model || "").split(":").pop() || "starting…";
  l1 = l1.length > 34 ? l1.slice(0, 33) + "…" : l1;
  ctx.font = `11px ${FONT}`;
  const w = Math.max(ctx.measureText(l1).width, ctx.measureText(l2).width) + 20, h = 40;
  const bx = Math.max(8, Math.min(W - w - 8, a.hx - w / 2)), by = DESK_Y - 96;
  px(bx, by, w, h, "#15171d"); ctx.strokeStyle = a.m.col; ctx.lineWidth = 1; ctx.strokeRect(bx + .5, by + .5, w - 1, h - 1);
  text(l1, bx + 10, by + 7, 11, C.ink); text(l2, bx + 10, by + 22, 10, C.dim);
}

function burst(x, y, colors, n = 18) { for (let k = 0; k < n; k++) particles.push({x, y, vx:(Math.random() - .5) * .35, vy:-Math.random() * .4 - .05, life:900 + Math.random() * 500, c:colors[k % colors.length]}); }
function float(x, y, s, c) { floats.push({x, y, s, c, life:2200}); }
function fly(from, to, c) { letters.push({x0:from.x, y0:from.y, x1:to.x, y1:to.y, t:0, dur:1100, c}); }

let last = performance.now();
function frame(now) {
  const dt = Math.min(64, now - last); last = now; clock += dt;
  drawFloor();
  agents.forEach(a => a.update(dt));
  [...agents].sort((p, q) => p.y - q.y).forEach(a => { if (a.y < DESK_Y + 20) drawAgent(a); });
  agents.forEach(drawDesk); drawInbox();
  [...agents].sort((p, q) => p.y - q.y).forEach(a => { if (a.y >= DESK_Y + 20) drawAgent(a); });
  letters = letters.filter(l => (l.t += dt) < l.dur);
  for (const l of letters) { const t = l.t / l.dur, e = t * t * (3 - 2 * t); envelope(l.x0 + (l.x1 - l.x0) * e, l.y0 + (l.y1 - l.y0) * e - Math.sin(Math.PI * t) * 40, l.c); }
  particles = particles.filter(p => (p.life -= dt) > 0);
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 0.0008 * dt; px(p.x, p.y, 2, 2, p.c); }
  floats = floats.filter(f => (f.life -= dt) > 0);
  for (const f of floats) { ctx.globalAlpha = Math.min(1, f.life / 600); text(f.s, f.x, f.y - (2200 - f.life) / 45, 11, f.c, "center"); ctx.globalAlpha = 1; }
  agents.forEach(bubble);
  if (STATE && STATE.stop) { ctx.fillStyle = "rgba(14,15,19,.6)"; ctx.fillRect(0, 0, W, H); text("stopped", W / 2, H / 2 - 8, 14, "#ef6b6b", "center"); }
  requestAnimationFrame(frame);
}

// ---------- events -> animation ----------
const ICON = {"task.created":"+","run.started":"▸","task.done":"✓","task.failed":"✗","task.retry":"↻","task.rate_limited":"z","task.blocked":"■",
  "task.spawn_refused":"⊘","task.crashed":"✗","hyp.status":"◆","verdict":"=","alert.stall":"!","alert.validated":"★","runner.started":"·"};
const KCOL = {"task.done":"#6fd08c","task.failed":"#ef6b6b","task.crashed":"#ef6b6b","task.retry":"#e8c468","task.rate_limited":"#b597ff","alert.stall":"#ef6b6b","alert.validated":"#e8c468","hyp.status":"#6aa8ff"};
const STAMP = {prereg:["frozen","researcher","#6aa8ff"], backtest:["→ backtest","backtester","#6fd08c"], review:["→ review","skeptic","#e8c468"],
  validated:["validated","skeptic","#e8c468"], rejected:["rejected","skeptic","#ef6b6b"], parked:["parked","curator","#7c8090"]};
const PREV = {backtester:"researcher", skeptic:"backtester", researcher:"researcher", curator:"chief"};
const deskTop = role => ({x:ROLE[role].x, y:DESK_Y - 30});

function animate(e) {
  const d = JSON.parse(e.data || "{}"), a = byRole[d.role];
  switch (e.kind) {
    case "task.created": {
      const src = e.actor.startsWith("user") ? {x:INBOX.x, y:H} : e.actor === "lifecycle" ? deskTop(PREV[d.role] || "chief") : deskTop("chief");
      if (e.actor === "heartbeat") float(deskTop("chief").x, deskTop("chief").y - 70, "heartbeat", "#e8c468");
      fly(src, INBOX, ROLE[d.role] ? ROLE[d.role].col : C.ink); break; }
    case "run.started": if (a) fly(INBOX, deskTop(a.role), a.m.col); break;
    case "task.done": if (a) { burst(a.hx, DESK_Y - 30, [a.m.col, C.ink]); float(a.hx, DESK_Y - 110, "done", "#6fd08c"); } break;
    case "task.failed": case "task.crashed": if (a) float(a.hx, DESK_Y - 110, "failed", "#ef6b6b"); break;
    case "task.retry": if (a) float(a.hx, DESK_Y - 110, "retry", "#e8c468"); break;
    case "task.blocked": if (a) float(a.hx, DESK_Y - 110, "blocked", "#b597ff"); break;
    case "task.rate_limited": if (a) a.setMood("sleep", 9000); break;
    case "task.spawn_refused": float(deskTop("chief").x, DESK_Y - 130, "refused", "#ef6b6b"); break;
    case "hyp.status": { const s = STAMP[d.status]; if (s) { const p = deskTop(s[1]); float(p.x, p.y - 100, `${d.hypothesis}: ${s[0]}`, s[2]);
        if (d.status === "validated") { for (let k = 0; k < 3; k++) setTimeout(() => burst(p.x + (Math.random() - .5) * 120, p.y - 60, ["#e8c468", "#fff"], 30), k * 280); toast(`★ ${d.hypothesis} validated: needs your review`); } } break; }
    case "alert.stall": toast("stall detected: chief paused"); break;
  }
}
function describe(e) {
  const d = JSON.parse(e.data || "{}");
  const bits = [d.role, d.title, d.hypothesis && `[${d.hypothesis}]`, d.status, d.verdict, d.model && d.model.split(":").pop(), d.reason, d.why, d.msg].filter(Boolean);
  return `${e.kind.replace("task.", "")} ${e.task_id ? "#" + e.task_id : ""} ${bits.join(" · ")}`;
}
function feedLine(e) {
  const el = document.createElement("div"); el.className = "ev"; if (e.task_id) el.dataset.task = e.task_id;
  const t = new Date(e.ts * 1000).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit", second:"2-digit"});
  el.innerHTML = `<time>${t}</time><span class="k" style="color:${KCOL[e.kind] || "#7c8090"}">${ICON[e.kind] || "·"}</span>${esc(describe(e))}`;
  return el;
}
async function pollEvents() {
  try {
    const evs = await api(`/api/events?after=${lastEvent}&limit=${lastEvent ? 300 : 150}`);
    const feed = $("#feed"), first = lastEvent === 0;
    for (const e of evs) { if (!first) animate(e); feed.prepend(feedLine(e)); lastEvent = Math.max(lastEvent, e.id); }
    while (feed.children.length > 400) feed.lastChild.remove();
  } catch (_) {}
}

// ---------- state -> panels ----------
const HSTAGES = [["idea","#7c8090"],["prereg","#6aa8ff"],["backtest","#6aa8ff"],["review","#e8c468"],["validated","#6fd08c"],["rejected","#ef6b6b"],["parked","#4a4e5c"]];
async function pollState() {
  try { STATE = await api("/api/state"); } catch (_) { $("#runnerTxt").textContent = "hq server unreachable"; return; }
  const s = STATE, online = s.runner_age_s !== null && s.runner_age_s < 45;
  $("#runnerDot").classList.toggle("on", online);
  $("#runnerTxt").textContent = online ? (s.runner_state || "online") : "runner offline";
  $("#runsChip").textContent = `${s.runs_today}/${s.max_runs}`;
  $("#memChip").textContent = `${s.mem_mb}MB`;
  $("#slotsChip").textContent = s.open_slots;
  $("#stopBtn").textContent = s.stop ? "resume" : "stop"; $("#stopBtn").className = "btn " + (s.stop ? "go" : "stop");
  $("#ackBtn").style.display = s.stalled ? "" : "none"; $("#stallBar").style.display = s.stalled ? "block" : "none";
  for (const a of agents) a.task = s.running.find(t => t.role === a.role) || null;

  $("#board").innerHTML = HSTAGES.map(([st, col]) => {
    const hs = s.hypotheses.filter(h => h.status === st);
    return `<h4><span>${st}</span><span>${hs.length}</span></h4>` +
      hs.map(h => `<div class="hyp" style="border-color:${col}">${esc(h.slug)}${h.reason ? `<div>${esc(h.reason)}</div>` : ""}</div>`).join("");
  }).join("") + (s.hypotheses.length ? "" : `<p class="muted">No hypotheses yet. Send the chief of staff an idea below.</p>`);

  const row = t => `<tr data-task="${t.id}" style="cursor:pointer"><td>#${t.id}</td><td>${esc(t.role)}</td><td>${esc(t.title)}${t.hypothesis ? ` <span class="muted">[${esc(t.hypothesis)}]</span>` : ""}</td></tr>`;
  $("#queue").innerHTML = `<h4>running</h4><table>${s.running.map(row).join("") || "<tr><td class=muted>idle</td></tr>"}</table>` +
    `<h4>queued</h4><table>${s.queued.map(row).join("") || "<tr><td class=muted>empty</td></tr>"}</table>`;
  $("#models").innerHTML = `<table><tr><th>model</th><th>runs</th><th>ok</th><th>avg</th></tr>` +
    s.stats.map(m => `<tr><td>${esc(m.model)}</td><td>${m.n}</td><td>${Math.round(100 * m.ok / m.n)}%</td><td>${Math.round(m.avg_s || 0)}s</td></tr>`).join("") +
    `</table><h4>routing</h4>` +
    Object.entries(s.roles).map(([r, v]) => `<div class="hyp">${esc(r)}<div>${v.models.map(esc).join(" → ")}</div></div>`).join("");
}

// ---------- inspector ----------
function openDrawer(title, html) { $("#dTitle").textContent = title; $("#dBody").innerHTML = html; $("#drawer").classList.add("on"); }
async function openTask(id) {
  const d = await api(`/api/task/${id}`); if (d.error) return;
  const t = d.task, res = t.result ? JSON.parse(t.result) : null;
  openDrawer(`#${t.id} ${t.role}`, `<p>${esc(t.title)}</p>
    <p class="muted">status ${esc(t.status)} · attempts ${t.attempts}/${t.max_attempts} · hypothesis ${esc(t.hypothesis || "—")}</p>
    ${res ? `<h4>result</h4><pre>${esc(JSON.stringify(res, null, 2))}</pre>` : ""}
    <h4>runs</h4><table>${d.runs.map(r => `<tr><td>${esc(r.model)}</td><td>${esc(r.outcome || "running")}</td><td>${r.ended ? Math.round(r.ended - r.started) + "s" : ""}</td></tr>`).join("") || "<tr><td class=muted>not started</td></tr>"}</table>
    <h4>spec</h4><pre>${esc(t.spec)}</pre>
    <h4>log tail</h4><pre>${esc(d.log || "(no log)")}</pre>`);
}
function openAgent(a) {
  const cur = a.task || (STATE && STATE.last_by_role[a.role]);
  const chain = STATE && STATE.roles[a.role] ? STATE.roles[a.role].models.map(esc).join(" → ") : "";
  openDrawer(a.m.name, `<p>${esc(a.m.blurb)}</p><p class="muted">model chain: ${chain}</p>
    ${cur ? `<p>${a.task ? "working on" : "last task"}: <a href="#" data-open="${cur.id}">#${cur.id} ${esc(cur.title)}</a></p>` : "<p class=muted>No tasks yet.</p>"}`);
}
cv.addEventListener("click", ev => {
  const b = cv.getBoundingClientRect(), x = (ev.clientX - b.left) * W / b.width, y = (ev.clientY - b.top) * H / b.height;
  const a = agents.find(a => a.hit(x, y)); if (a) return openAgent(a);
  if (Math.abs(x - INBOX.x) < 60 && y > 200) { document.querySelector('[data-tab="queue"]').click(); }
});
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-task],[data-open]"); if (!el) return;
  ev.preventDefault(); openTask(el.dataset.task || el.dataset.open);
});
$("#dClose").onclick = () => $("#drawer").classList.remove("on");
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#drawer").classList.remove("on"); });
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button,.pane").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); $("#" + b.dataset.tab).classList.add("on");
});

// ---------- commands ----------
function toast(s) { const t = $("#toast"); t.textContent = s; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", 5000); }
$("#cmdRole").onchange = e => {
  const r = e.target.value; $("#cmdSlug").style.display = r === "researcher" ? "" : "none"; $("#cmdSlug").required = r === "researcher";
  $("#cmdText").placeholder = {chief:"Tell the chief of staff what to look into…", researcher:"Describe the idea and its mechanism…", curator:"What should be tidied up?"}[r];
};
$("#cmd").onsubmit = async e => {
  e.preventDefault();
  const role = $("#cmdRole").value, txt = $("#cmdText").value.trim(); if (!txt) return;
  const body = role === "chief" ? {role, title:`Instruction from Kapil: ${txt}`, spec:{instruction:txt}}
    : role === "researcher" ? {role, title:txt, hypothesis:$("#cmdSlug").value.trim(), spec:{idea:txt}}
    : {role, title:txt, spec:{instruction:txt}};
  const r = await api("/api/task", body);
  if (r.error) return toast(r.error);
  $("#cmdText").value = "";
  const online = STATE && STATE.runner_age_s !== null && STATE.runner_age_s < 45;
  toast(online ? `queued #${r.id} for ${role}` : `queued #${r.id}. The runner is offline: start it with \`kb serve\``);
  pollEvents(); pollState();
};
$("#stopBtn").onclick = async () => { await api(STATE && STATE.stop ? "/api/resume" : "/api/stop", {}); pollState(); };
$("#ackBtn").onclick = async () => { await api("/api/ack", {}); pollState(); };

pollState(); pollEvents();
setInterval(pollState, 2000); setInterval(pollEvents, 2000);
requestAnimationFrame(frame);
</script>
</body>
</html>
