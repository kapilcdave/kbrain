models = ["codex:gpt-5.6-sol@medium", "agy:gemini-3.8-flash-high", "opencode:opencode/big-pickle"]
timeout_s = 900
tools = ["Read", "Write", "Bash(./kbssh:*)", "Bash(git:*)"]
with_priors = true
with_fleet = true
with_corpus = true
worktree = true
digest = true
can_spawn = true
spawnable = ["researcher", "curator"]
heartbeat_only = true        # the chief wakes on a heartbeat, not every 90 s

