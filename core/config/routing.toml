with_stats = true
with_data = true
with_dossier = true

[roles.skeptic]              # strong model, different family from the backtester
standing_orders = false
with_priors = true
with_corpus = true
models = ["agy:claude-sonnet-4-6", "codex:gpt-5.6-sol@medium", "agy:gemini-3.8-flash-high"]
timeout_s = 1200
tools = ["Read", "Write", "Bash(python3:*)"]
independent_of = "backtester"
with_stats = true
with_data = true
with_dossier = true
