# kbrain routing: an idea pipeline, not a standing firm. NOTHING runs unless an operator idea is in flight.
#
#   you --idea--> CHIEF (triage, pick venue, kill early)
#                   -> VENUE BRO (kalshi | hyperliquid | gemini | polymarket): prereg with only its venue's dossier
#                   -> DATA ENGINEER (only if data is missing) -> BACKTESTER -> SKEPTIC     (code routes these)
#                   -> VENUE BRO (verdict into its dossier; deploy brief if validated)
#                   -> CHIEF (deploys DRY on the box) -> you arm live
#
# Models: judgement steps get the strong models (chief: codex gpt-5.6-sol medium; skeptic: Claude Sonnet 4.6 via
# agy, Google's quota). Mechanical steps get cheap ones (gpt-5.6-luna / terra, agy Gemini 3.8 Flash, free opencode).
# No Claude from the operator's own quota. A model that reports a usage limit is killed within seconds and cools down.

[limits]
min_mem_mb = 900
max_queued = 20
max_depth = 8                # chief -> venue -> backtester -> engineer -> backtester -> skeptic -> venue -> chief
rate_limit_backoff_s = 1800
heartbeat_s = 1000000000     # no chief heartbeat: the chief wakes only for your ideas and for deploys
max_runs_per_day = 1000000   # uncapped (operator 2026-11-01); quotas are handled by the rate-limit watchdog
stall_runs = 30
dedup_days = 14
max_tasks_per_hypothesis = 10
max_open_hypotheses = 3      # ideas in flight at once
max_waiting_on_data = 3
max_workers = 3
launch_spacing_s = 8
max_jobs = 3
max_job_s = 14400
job_mem_mb = 1024

[venues]
list = ["kalshi", "hyperliquid", "gemini", "polymarket"]

[domains]
list = ["kalshi", "hyperliquid", "gemini", "polymarket"]

[gates]
min_units = 30
max_prereg_attempts = 2
max_data_attempts = 2

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
key_env = "OPENROUTER_API_KEY"

[roles.chief]
standing_orders = false
heartbeat_only = true
models = ["codex:gpt-5.6-sol@medium", "agy:gemini-3.8-flash-high", "opencode:opencode/big-pickle"]
timeout_s = 1200
tools = ["Read", "Write", "Edit", "Bash(./kbssh:*)", "Bash(git:*)", "Bash(python3:*)"]
with_priors = true
with_fleet = true
with_corpus = true
with_dossiers = true         # every venue's dossier, for triage
worktree = true
can_spawn = true
spawnable = ["kalshi", "hyperliquid", "gemini", "polymarket"]

# venue bros: own a dossier; write the prereg and the verdict for their venue's ideas
[roles.kalshi]
venue_bro = true
standing_orders = false
focus = "Kalshi recurring short-horizon markets (15M / hourly crypto and other recurring series). Box: rustmaker (us-east-2), code ~/proj/rustmaker and ~/proj/kap."
models = ["codex:gpt-5.6-luna", "codex:gpt-5.6-terra", "agy:gemini-3.8-flash-medium", "opencode:opencode/big-pickle"]
timeout_s = 1200
tools = ["Read", "Write", "Edit", "Bash(python3:*)", "Bash(git:*)"]
with_priors = true
with_corpus = true
with_fleet = true
worktree = true

