# kbrain routing: bio x AI research (genomics, DNA, proteins, single-cell, drug discovery).
#
#   you / chief --idea--> CHIEF triage -> FIELD BRO (genomics | proteins | cells | clinic) writes the prereg with its
#   dossier -> DATA ENGINEER (if data is missing) -> EXPERIMENTER (role id: backtester) -> SKEPTIC     (code routes these)
#   -> FIELD BRO (verdict into its dossier, write-up if validated) -> CHIEF (finding + opportunity; costed proposals
#   for anything that spends money go to the operator)
#   SCOUT: the one continuous bro, on cheap models: field intelligence + candidate experiments + opportunities.
#
# Models: judgement steps get strong models (chief: codex gpt-5.6-sol medium; skeptic: Claude Sonnet 4.6 via agy);
# mechanical steps and the scout get cheap ones (gpt-5.6-luna / terra, agy Gemini 3.8 Flash, free opencode).
# A model that reports a usage limit is killed within seconds and cools down; the next model takes over.

[limits]
min_mem_mb = 900
max_queued = 20
max_depth = 8
rate_limit_backoff_s = 1800
heartbeat_s = 300            # a free slot for 5 min -> the chief picks the next experiment itself
max_runs_per_day = 1000000   # uncapped (operator 2026-11-01)
stall_runs = 30
dedup_days = 14
max_tasks_per_hypothesis = 10
max_open_hypotheses = 3      # experiments in flight at once
max_waiting_on_data = 3
max_workers = 3
launch_spacing_s = 8
desk_gap_s = 600             # the scout's pause between shifts
max_jobs = 2
max_job_s = 14400
job_mem_mb = 2048

[venues]                     # the fields (internal name kept: "venues")
list = ["genomics", "proteins", "cells", "clinic"]

[domains]
list = ["genomics", "proteins", "cells", "clinic"]

[gates]
min_units = 30               # independent units (genes, protein families, donors, folds), not rows
max_prereg_attempts = 2
max_data_attempts = 2

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
key_env = "OPENROUTER_API_KEY"

[roles.chief]
standing_orders = false
heartbeat_only = true
models = ["codex:gpt-5.6-sol@medium", "agy:gemini-3.8-flash-high", "opencode:opencode/big-pickle"]
timeout_s = 1200
tools = ["Read", "Write", "Edit", "Bash(git:*)", "Bash(python3:*)", "WebFetch", "WebSearch"]
with_dossiers = true
digest = true
worktree = true
can_spawn = true
spawnable = ["genomics", "proteins", "cells", "clinic"]

[roles.scout]                # continuous field intelligence on cheap models
desk = true
standing_orders = false
focus = "bio x AI field intelligence: new papers/models/datasets in genomics, DNA language models, regulatory genomics, proteins, single-cell, drug discovery; candidate experiments; opportunities."
models = ["agy:gemini-3.8-flash-medium", "codex:gpt-5.6-luna", "opencode:opencode/big-pickle", "opencode:opencode/glm-5.3-flash-free"]
timeout_s = 900
tools = ["Read", "Write", "Edit", "Bash(python3:*)", "Bash(git:*)", "WebFetch", "WebSearch"]
worktree = true

# field bros: own a dossier; write the prereg and the verdict for their field's experiments
[roles.genomics]
venue_bro = true
standing_orders = false
focus = "Genomics and DNA: sequence-to-function models (Enformer/Borzoi-style), DNA language models (Evo, Nucleotide Transformer, HyenaDNA, Caduceus), regulatory variants and eQTLs, variant effect prediction, gnomAD constraint, ENCODE/GTEx."
models = ["codex:gpt-5.6-luna", "codex:gpt-5.6-terra", "agy:gemini-3.8-flash-medium", "opencode:opencode/big-pickle"]
timeout_s = 1500
tools = ["Read", "Write", "Edit", "Bash(python3:*)", "Bash(git:*)", "WebFetch", "WebSearch"]
worktree = true

[roles.proteins]
venue_bro = true
standing_orders = false
focus = "Proteins: structure prediction (AlphaFold, ESMFold), protein language models (ESM-2/3), design (RFdiffusion, ProteinMPNN), fitness and mutation effect (ProteinGym, deep mutational scans), UniProt/PDB/AlphaFold DB."
models = ["codex:gpt-5.6-terra", "codex:gpt-5.6-luna", "agy:gemini-3.8-flash-medium", "opencode:opencode/big-pickle"]
timeout_s = 1500
tools = ["Read", "Write", "Edit", "Bash(python3:*)", "Bash(git:*)", "WebFetch", "WebSearch"]
worktree = true

[roles.cells]
venue_bro = true
standing_orders = false
focus = "Cells and omics: single-cell RNA/ATAC, cell atlases (CZ CELLxGENE, Human Cell Atlas), single-cell foundation models (scGPT, Geneformer) vs simple baselines, perturbation prediction (Perturb-seq), spatial omics."
models = ["codex:gpt-5.6-luna", "codex:gpt-5.6-terra", "agy:gemini-3.8-flash-medium", "opencode:opencode/big-pickle"]
timeout_s = 1500
tools = ["Read", "Write", "Edit", "Bash(python3:*)", "Bash(git:*)", "WebFetch", "WebSearch"]
worktree = true

[roles.clinic]
venue_bro = true
standing_orders = false
focus = "Drug discovery and the clinic: target identification, molecular property and binding prediction (ChEMBL, MoleculeNet, TDC), genetic support for targets, clinical trials (ClinicalTrials.gov) and biotech catalysts, the bio x AI company landscape."
models = ["codex:gpt-5.6-terra", "codex:gpt-5.6-luna", "agy:gemini-3.8-flash-medium", "opencode:opencode/big-pickle"]
timeout_s = 1500
tools = ["Read", "Write", "Edit", "Bash(python3:*)", "Bash(git:*)", "WebFetch", "WebSearch"]
worktree = true

# shared specialists: get the experiment's field dossier staged
[roles.engineer]
standing_orders = false
models = ["codex:gpt-5.6-luna", "agy:gemini-3.8-flash-medium", "codex:gpt-5.6-terra", "opencode:opencode/big-pickle"]
timeout_s = 1500
tools = ["Read", "Write", "Edit", "WebFetch", "WebSearch", "Bash(python3:*)"]
with_data = true
with_dossier = true

[roles.backtester]           # the EXPERIMENTER
standing_orders = false
models = ["codex:gpt-5.6-terra", "codex:gpt-5.6-luna", "agy:gemini-3.8-flash-medium", "opencode:opencode/big-pickle"]
timeout_s = 3600
tools = ["Read", "Write", "Edit", "Bash(python3:*)"]
requires_prereg = true
with_stats = true
with_data = true
with_dossier = true

[roles.skeptic]              # strong model, different family from the experimenter
standing_orders = false
models = ["agy:claude-sonnet-4-6", "codex:gpt-5.6-sol@medium", "agy:gemini-3.8-flash-high"]
timeout_s = 1500
tools = ["Read", "Write", "Bash(python3:*)"]
independent_of = "backtester"
with_stats = true
with_data = true
with_dossier = true
