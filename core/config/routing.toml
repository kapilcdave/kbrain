# kbrain routing. Role -> ordered fallback chain of "backend:model[@effort]". A model that reports a usage or
# rate limit is killed within seconds (watchdog) and cools down for rate_limit_backoff_s; the next model takes over.
#
# Models (operator, 2026-11-01):
#   chief of staff  = codex gpt-5.6-sol at medium effort
#   everyone else   = codex gpt-5.6-sol at low effort, gpt-5.6-luna or gpt-5.6-terra (chains are staggered so
#                     desks do not all hit the same model first), then agy (Gemini 3.8 Flash; Claude Sonnet 4.6
#                     on Google's quota for review), then free opencode models.
#   No Claude (operator's own quota) in any chain.
# Backends: codex (codex exec), agy (Antigravity, Google login), opencode (opencode run; free tier has a usage
# limit), claude (claude -p), api (tool-less HTTP, see [providers]), shell (deterministic).
# Backends that are not installed are skipped automatically.
#
# Two kinds of roles:
#   DESKS (desk = true) are standing pixel bros that work continuously, one shift after another, in their own
#     git worktree; the harness merges their commits to main. This is the "one continuous run".
#   PIPELINE roles (researcher, backtester, engineer, skeptic, curator) are spawned by kb/lifecycle.py to push a
#     preregistered hypothesis through prereg -> data -> backtest -> review.

[limits]
min_mem_mb = 900             # ~8GB box: don't launch agents under memory pressure
max_queued = 60
max_depth = 3
rate_limit_backoff_s = 1800
heartbeat_s = 600
max_runs_per_day = 600       # circuit breaker; desks run continuously
stall_runs = 80
dedup_days = 14
max_tasks_per_hypothesis = 8
max_open_hypotheses = 6
max_waiting_on_data = 3      # refuse new hypotheses while this many sit in 'data' (anti strategy-hopping)
max_workers = 5              # agents at once; launches still wait for free memory
launch_spacing_s = 8
desk_gap_s = 90              # pause between one desk's shifts
max_jobs = 3
max_job_s = 14400
job_mem_mb = 1024
idle_cooldown_s = 900
scout_cooldown_s = 21600
refresh_after_s = 86400

[domains]                    # focus: recurring, short-horizon markets that can go live
list = [
  "Kalshi recurring short-horizon markets (15M / hourly crypto and other recurring series)",
  "Hyperliquid perps: maker/taker microstructure, funding, liquidations",
  "Gemini and Polymarket US recurring 5M/15M crypto markets, cross-venue with Kalshi",
  "crypto spot venues as lead/fair-value feeds (Coinbase, Binance, Hyperliquid)",
]

[gates]
min_units = 30
max_prereg_attempts = 2
max_data_attempts = 2

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
key_env = "OPENROUTER_API_KEY"

# ---------------------------------------------------------------- desks (standing, continuous)
