# ---------------------------------------------------------------- pipeline roles (spawned by lifecycle)
[roles.researcher]
standing_orders = false      # desks do the scouting now
with_priors = true
with_corpus = true
models = ["codex:gpt-5.6-luna", "agy:gemini-3.8-flash-medium", "opencode:opencode/big-pickle", "opencode:opencode/glm-5.3-flash-free"]
timeout_s = 1200
tools = ["Read", "Write", "Edit", "WebFetch", "WebSearch"]

[roles.curator]
with_corpus = true
models = ["opencode:opencode/glm-5.3-flash-free", "opencode:opencode/big-pickle", "codex:gpt-5.6-luna"]
timeout_s = 600
tools = ["Read", "Write", "Edit"]

[roles.backtester]
with_priors = true
with_corpus = true
models = ["codex:gpt-5.6-terra", "codex:gpt-5.6-sol@low", "agy:gemini-3.8-flash-medium", "opencode:opencode/big-pickle"]
timeout_s = 1800
tools = ["Read", "Write", "Edit", "Bash(python3:*)"]
requires_prereg = true
with_stats = true
with_data = true

[roles.engineer]
standing_orders = false      # the data desk owns bootstrap/refresh now; engineer serves blocked backtests
collector_rules = true
models = ["codex:gpt-5.6-sol@low", "codex:gpt-5.6-luna", "agy:gemini-3.8-flash-medium", "opencode:opencode/big-pickle"]
timeout_s = 1500
tools = ["Read", "Write", "Edit", "WebFetch", "WebSearch", "Bash(python3:*)"]
with_data = true

[roles.skeptic]              # prefers a different backend family than the backtester's
with_priors = true
with_corpus = true
models = ["agy:claude-sonnet-4-6", "agy:gemini-3.8-flash-high", "codex:gpt-5.6-terra"]
timeout_s = 1200
tools = ["Read", "Write", "Bash(python3:*)"]
independent_of = "backtester"
with_stats = true
with_data = true
